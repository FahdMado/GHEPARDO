<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>GHEPARDO | Secure Downloads</title>
<style>
:root{color-scheme:dark;--gold:#e5a93c;--light:#f8cf7a;--muted:#a69d8e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070606;color:#f5f2eb;font:16px Arial,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(100%,560px);background:#120f0e;border:1px solid rgba(229,169,60,.4);border-radius:22px;padding:28px;box-shadow:0 20px 70px #000}
.brand{color:var(--light);letter-spacing:3px;font-weight:800;font-size:22px;text-align:center;margin-bottom:22px}
h1{font-size:21px;color:var(--light);text-align:center}p{color:var(--muted);line-height:1.6;text-align:center;font-size:14px}
.status{padding:14px;border-radius:12px;background:#090807;border:1px solid rgba(229,169,60,.2);margin:18px 0;text-align:center}
.file{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:#090807;border:1px solid rgba(229,169,60,.25);border-radius:12px;margin:10px 0}
.file strong{display:block;font-size:14px}.file small{color:var(--muted);display:block;margin-top:5px}
.download{background:linear-gradient(135deg,var(--light),var(--gold));color:#080706;padding:10px 14px;border-radius:30px;text-decoration:none;font-weight:800;font-size:13px;white-space:nowrap}
.back{display:block;text-align:center;color:var(--light);margin-top:22px;text-decoration:none;font-size:13px}
@media(max-width:420px){.file{align-items:flex-start;flex-direction:column}.download{width:100%;text-align:center}}
</style>
\n  <meta name="ghepardo-app" content="store" />\n  <link rel="manifest" href="/GHEPARDO/store.webmanifest" />\n  <script src="/GHEPARDO/pwa-install.js" defer></script>\n</head>
<body><main>
<div class="brand">GHEPARDO</div><h1>Your secure digital order</h1>
<p>Keep this private link. Your files will appear here after your payment is verified.</p>
<div id="status" class="status">Checking your order…</div><div id="expiry" class="status" hidden></div><div id="files"></div>
<a class="back" href="products.html">← Back to GHEPARDO store</a>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const config={apiKey:"AIzaSyD0S16iK5sxnnWb_s4_l41Op1fJE3fZNbI",authDomain:"ghepardo-1.firebaseapp.com",databaseURL:"https://ghepardo-1-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ghepardo-1",storageBucket:"ghepardo-1.firebasestorage.app",messagingSenderId:"814705402338",appId:"1:814705402338:web:a3e7541baf91e6d95099bb"};
const token=new URLSearchParams(location.search).get("token")||"";
const status=document.getElementById("status"),box=document.getElementById("files"),expiry=document.getElementById("expiry");
let expiryTimer=null;
if(!/^[a-f0-9]{48}$/.test(token)){status.textContent="This download link is invalid. Please use the private link provided after checkout.";}
else{
 const db=getDatabase(initializeApp(config));
 onValue(ref(db,"downloads/"+token),snap=>{
  const data=snap.val();
  if(!data){status.textContent="Payment is awaiting verification. This page will update automatically after GHEPARDO confirms your payment.";return;}
  if(!data.expiresAt||Date.now()>Number(data.expiresAt)){status.textContent="This download link has expired or is no longer available. Please contact GHEPARDO for a new link.";box.replaceChildren();expiry.hidden=true;if(expiryTimer)clearInterval(expiryTimer);return;}
  status.textContent="✓ Payment confirmed. Your digital files are ready.";
  expiry.hidden=false;
  const expiresAt=Number(data.expiresAt);
  const updateExpiry=()=>{const remaining=expiresAt-Date.now();if(remaining<=0){expiry.textContent="Download access has expired. Please contact GHEPARDO.";box.replaceChildren();if(expiryTimer)clearInterval(expiryTimer);return;}const hours=Math.floor(remaining/3600000),minutes=Math.floor((remaining%3600000)/60000),seconds=Math.floor((remaining%60000)/1000);expiry.textContent="Secure link expires in "+hours+"h "+minutes+"m "+seconds+"s (23-hour access window).";};
  updateExpiry();if(expiryTimer)clearInterval(expiryTimer);expiryTimer=setInterval(updateExpiry,1000);
  box.replaceChildren();
  (Array.isArray(data.files)?data.files:Object.values(data.files||{})).forEach(file=>{
   const row=document.createElement("div");row.className="file";
   const info=document.createElement("div"),title=document.createElement("strong"),name=document.createElement("small");
   title.textContent=file.title||"GHEPARDO product";name.textContent=file.fileName||"Digital file";info.append(title,name);
   const link=document.createElement("a");link.className="download";link.textContent="Download";
   if(file.fileData){link.href=file.fileData;link.download=String(file.fileName||"GHEPARDO-download").replace(/[\\/]/g,"_");}
   else if(file.downloadUrl&&/^https:\/\//i.test(file.downloadUrl)){link.href=file.downloadUrl;link.target="_blank";link.rel="noopener noreferrer";}
   else{link.textContent="Unavailable";link.removeAttribute("href");}
   row.append(info,link);box.append(row);
  });
 },err=>{status.textContent="This link may have expired or is temporarily unavailable. Please contact GHEPARDO and share your order reference.";expiry.hidden=true;console.error(err);});
}
</script></body></html>

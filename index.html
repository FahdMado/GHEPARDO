  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0S16iK5sxnnWb_s4_l41Op1fJE3fZNbI",
      authDomain: "ghepardo-1.firebaseapp.com",
      databaseURL: "https://ghepardo-1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ghepardo-1",
      storageBucket: "ghepardo-1.firebasestorage.app",
      messagingSenderId: "814705402338",
      appId: "1:814705402338:web:a3e7541baf91e6d95099bb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const OWNER_WHATSAPP = "201206692683";

    const products = [
      { id: 1, title: "Factory Live Production Dashboard", category: "dashboard", badge: "BEST SELLER", emoji: "📊", desc: "Real-time KPI & production tracking web dashboard powered by Firebase & GitHub Pages.", price: 750 },
      { id: 2, title: "GHEPARDO Executive Notion OS", category: "notion", badge: "NEW", emoji: "🗂️", desc: "All-in-one Notion command center for projects, SOPs, finance tracking, and daily execution.", price: 350 },
      { id: 3, title: "Smart Inventory & Kanban Excel System", category: "tools", badge: "PRO", emoji: "⚡", desc: "Automated Excel + VBA inventory, supermarket Kanban & cost control workbook.", price: 490 },
      { id: 4, title: "Personal Wealth & Investment Tracker", category: "tools", badge: "POPULAR", emoji: "💎", desc: "Complete financial calculator & Thndr/gold portfolio tracker tailored for smart investors.", price: 290 }
    ];

    let cart = [];

    window.renderProducts = function(filter = 'all') {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';
      const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
      filtered.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <div class="product-banner">
              <span class="product-badge">${p.badge}</span>
              <div class="product-emoji">${p.emoji}</div>
              <div class="product-cat">${p.category}</div>
            </div>
            <div class="product-body">
              <h4>${p.title}</h4>
              <p>${p.desc}</p>
              <div class="product-footer">
                <div class="price">${p.price} <small>EGP</small></div>
                <button class="btn-gold" style="padding:8px 14px; font-size:0.8rem;" onclick="addToCart(${p.id})">Buy Now +</button>
              </div>
            </div>
          </div>`;
      });
    };

    window.filterProducts = function(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(cat);
    };

    window.addToCart = function(id) {
      cart.push(products.find(p => p.id === id));
      updateCartUI();
      openCart();
    };

    window.removeFromCart = function(index) {
      cart.splice(index, 1);
      updateCartUI();
    };

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      document.getElementById('mob-cart-count').innerText = cart.length;
      const list = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      if (cart.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Your cart is empty.</p>';
        totalEl.innerText = '0 EGP';
        return;
      }
      let total = 0;
      list.innerHTML = '';
      cart.forEach((item, idx) => {
        total += item.price;
        list.innerHTML += `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:0.86rem;">
            <span>${item.title}</span>
            <div style="white-space:nowrap;">
              <strong style="color:var(--gold-light); margin-right:8px;">${item.price} EGP</strong>
              <button onclick="removeFromCart(${idx})" style="background:none; border:none; color:#ff5e5e; cursor:pointer;">✕</button>
            </div>
          </div>`;
      });
      totalEl.innerText = total + ' EGP';
    }

    window.openCart = function() { updateCartUI(); document.getElementById('checkout-modal').classList.add('open'); };
    window.closeCart = function() { document.getElementById('checkout-modal').classList.remove('open'); };
    window.copyText = function(elId) { navigator.clipboard.writeText(document.getElementById(elId).innerText); alert('Copied!'); };

    window.submitOrder = async function(e) {
      e.preventDefault();
      if (cart.length === 0) { alert('Please add at least one product first.'); return; }
      const btn = document.getElementById('submit-order-btn');
      btn.innerText = 'Saving Order...';
      btn.disabled = true;

      const name = document.getElementById('cust-name').value;
      const contact = document.getElementById('cust-contact').value;
      const refNum = document.getElementById('cust-ref').value;
      const total = cart.reduce((sum, i) => sum + i.price, 0);

      try {
        await push(ref(db, 'orders'), {
          customerName: name,
          contact: contact,
          paymentReference: refNum,
          items: cart.map(i => ({ title: i.title, price: i.price })),
          totalEGP: total,
          status: "pending",
          timestampMs: Date.now()
        });
      } catch (err) {
        console.warn(err);
      }

      const itemsText = cart.map(i => `- ${i.title} (${i.price} EGP)`).join('%0A');
      const msg = `*NEW GHEPARDO ORDER*%0A*Name:* ${name}%0A*Delivery Contact:* ${contact}%0A*Payment Ref:* ${refNum}%0A*Items:*%0A${itemsText}%0A*Total:* ${total} EGP`;
      btn.innerText = 'Confirm Order & Send via WhatsApp →';
      btn.disabled = false;
      window.open(`https://wa.me/${OWNER_WHATSAPP}?text=${msg}`, '_blank');
    };

    window.subscribeUser = async function(e) {
      e.preventDefault();
      const email = document.getElementById('sub-email').value;
      try {
        await push(ref(db, 'subscribers'), { email: email, timestampMs: Date.now() });
      } catch (err) { console.warn(err); }
      document.getElementById('sub-msg').innerText = '✓ Welcome to GHEPARDO! Subscribed: ' + email;
      document.getElementById('sub-email').value = '';
    };

    renderProducts();
  </script>
